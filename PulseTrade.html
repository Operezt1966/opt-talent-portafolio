<style>
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  /* Density variants */
  body.dense .card { padding: 14px; }
  body.dense .main { padding: 22px 28px 70px; }
  body.dense .detail-name { font-size: 76px; }
  body.dense .detail-price .big { font-size: 52px; }
  body.aireada .card { padding: 28px; }
  body.aireada .main { padding: 56px 56px 100px; }
  /* No glow variant */
  body.no-glow * { filter: none !important; box-shadow: none !important; text-shadow: none !important; }
  body.no-glow .logo .pulse,
  body.no-glow .statusbar .live::before,
  body.no-glow .sent::before { animation: none; }
</style>
